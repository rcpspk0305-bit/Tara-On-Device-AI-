name: Tara Phase 1 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and compilation
        run: bash ./gradlew :core:domain:test testDebugUnitTest lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --continue
      - name: Verify test discovery
        run: python3 tools/check-phase1-tests.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tara-phase1-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tara-phase1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: bash ./gradlew :app:connectedDebugAndroidTest :feature:onboarding:connectedDebugAndroidTest :feature:assistant:connectedDebugAndroidTest :platform:androidactions:connectedDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tara-instrumentation
          path: '**/build/reports/androidTests/'
